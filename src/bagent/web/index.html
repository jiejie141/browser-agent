<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browser-agent · 控制台</title>
<style>
/* ------------------------------------------------------------------
   深色科技感主题
   配色：近黑底 + 电光青(#22d3ee) / 蓝紫(#7c8cff) 双强调 + 琥珀警示
   所有颜色集中在 :root，改主题只动这里
------------------------------------------------------------------ */
:root{
  --bg:#080b12;          /* 页面底 */
  --panel:#0e131d;       /* 卡片 */
  --panel-2:#131a26;     /* 次级面 */
  --line:#1e2836;        /* 分隔线 */
  --line-2:#2a3648;      /* 强分隔线 */
  --fg:#e6edf7;          /* 主文字 */
  --fg-2:#93a1b8;        /* 次级文字 */
  --fg-3:#5d6b82;        /* 弱文字 */
  --cyan:#22d3ee;        /* 主强调 */
  --violet:#7c8cff;      /* 副强调 */
  --amber:#fbbf24;       /* 进行中 */
  --green:#34d399;       /* 成功 */
  --red:#f87171;         /* 失败 */
  --glow:0 0 0 1px rgba(34,211,238,.25), 0 0 24px -6px rgba(34,211,238,.45);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* 背景网格 + 顶部光晕，营造"科技感"但不喧宾夺主 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(34,211,238,.10), transparent 62%),
    radial-gradient(760px 380px at 92% -4%, rgba(124,140,255,.10), transparent 60%),
    linear-gradient(rgba(255,255,255,.017) 1px, transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg, rgba(255,255,255,.017) 1px, transparent 1px) 0 0/34px 100%;
}
.wrap{position:relative; z-index:1; max-width:1220px; margin:0 auto; padding:26px 22px 64px}

/* ---------- 顶栏 ---------- */
header{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--cyan),var(--violet));
  display:grid;place-items:center; color:#06121a; font-weight:800; font-size:16px;
  box-shadow:0 0 22px -4px rgba(34,211,238,.6);
}
h1{font-size:18px; margin:0; letter-spacing:.2px}
h1 small{display:block; font-size:11.5px; color:var(--fg-3); font-weight:400; letter-spacing:.6px}
.spacer{flex:1}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px; font-size:11.5px;
  border:1px solid var(--line-2); color:var(--fg-2); background:var(--panel);
  font-family:var(--mono);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}

/* ---------- 卡片 ---------- */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)) , var(--panel);
  border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px;
}
.card + .card{margin-top:16px}
.card h2{
  font-size:12px; margin:0 0 14px; letter-spacing:1.3px; text-transform:uppercase;
  color:var(--fg-3); font-weight:600; display:flex; align-items:center; gap:9px;
}
.card h2::before{
  content:""; width:3px; height:12px; border-radius:2px;
  background:linear-gradient(180deg,var(--cyan),var(--violet));
}

/* ---------- 表单一 ---------- */
.grid{display:grid; grid-template-columns:1fr 300px; gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
label{display:block; font-size:11.5px; color:var(--fg-3); margin:0 0 6px; letter-spacing:.4px}
input,textarea,select,button{font-family:inherit; font-size:13px}
input[type=text],textarea,select{
  width:100%; background:#0a0f17; color:var(--fg);
  border:1px solid var(--line-2); border-radius:9px; padding:10px 12px;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
input[type=text]:focus,textarea:focus,select:focus{
  border-color:var(--cyan); box-shadow:var(--glow);
}
textarea{resize:vertical; min-height:76px; line-height:1.55}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row > .f{flex:1; min-width:150px}
.f{margin-bottom:13px}
.hint{font-size:11px; color:var(--fg-3); margin-top:5px}
.btn{
  border:1px solid transparent; border-radius:9px; padding:10px 18px;
  font-weight:600; cursor:pointer; transition:.15s; letter-spacing:.3px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#06121a;
  box-shadow:0 4px 20px -6px rgba(34,211,238,.7);
}
.btn-primary:hover{filter:brightness(1.1); transform:translateY(-1px)}
.btn-primary:disabled{opacity:.45; cursor:not-allowed; transform:none; filter:none}
.btn-ghost{background:transparent; border-color:var(--line-2); color:var(--fg-2)}
.btn-ghost:hover{border-color:var(--cyan); color:var(--cyan)}
.chk{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--fg-2); cursor:pointer}
.chk input{accent-color:var(--cyan); width:15px; height:15px}
.quick{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.quick-label{font-size:11px; color:var(--fg-3); margin-top:11px; letter-spacing:.3px}
.quick-label b{color:var(--fg-2); font-weight:600}
.quick button{
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--fg-2);
  border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer; transition:.15s;
}
.quick button:hover{border-color:var(--cyan); color:var(--cyan)}
.quick button.risky{border-style:dashed; border-color:rgba(251,191,36,.42)}
.quick button.risky:hover{border-color:var(--amber); color:var(--amber)}

/* ---------- 选站搜索 ---------- */
.lead{margin:0 0 14px; font-size:12.5px; color:var(--fg-2); line-height:1.7}
.lead b{color:var(--cyan); font-weight:600}
.sitebar{display:flex; gap:9px; flex-wrap:wrap}
.sitebar select,.sitebar input{
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--fg);
  border-radius:8px; padding:9px 11px; font-size:13px; font-family:var(--sans);
}
.sitebar select{flex:0 0 210px}
.sitebar input{flex:1 1 260px; min-width:180px}
.sitebar select:focus,.sitebar input:focus{outline:none; border-color:var(--cyan)}
.sitebar .btn{flex:0 0 auto; padding:9px 18px}
.sitehint,.hintline{margin-top:9px; font-size:11.5px; line-height:1.6; color:var(--fg-3)}
.sitehint .muted,.muted{color:var(--fg-3)}
.sitehint code{color:var(--fg-2); background:var(--panel-2); padding:1px 5px; border-radius:4px}
.sitehint .warn{color:var(--amber)}
.sitehint .good{color:var(--green)}
.opt-login{color:var(--amber)}

/* ---------- 结果面板 ---------- */
.result{margin-top:16px; border-top:1px solid var(--line); padding-top:16px; display:none}
.result.show{display:block}
.verdict{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px}
.badge{
  padding:5px 13px; border-radius:999px; font-size:12px; font-weight:700;
  font-family:var(--mono); letter-spacing:.5px;
}
.badge.ok{background:rgba(52,211,153,.14); color:var(--green); border:1px solid rgba(52,211,153,.35)}
.badge.bad{background:rgba(248,113,113,.14); color:var(--red); border:1px solid rgba(248,113,113,.35)}
.badge.run{background:rgba(251,191,36,.14); color:var(--amber); border:1px solid rgba(251,191,36,.35)}
.badge.idle{background:rgba(147,161,184,.12); color:var(--fg-2); border:1px solid var(--line-2)}
.badge.wait{background:rgba(96,165,250,.14); color:var(--blue); border:1px solid rgba(96,165,250,.35)}
.loginbox{display:none; border:1px solid rgba(96,165,250,.35); background:rgba(96,165,250,.08);
  border-radius:9px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.7}
.loginbox .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
.loginbox .hint{color:var(--fg-2)}
.answer{
  background:#0a0f17; border:1px solid var(--line-2); border-left:3px solid var(--cyan);
  border-radius:9px; padding:13px 15px; font-size:13.5px; line-height:1.75;
  white-space:pre-wrap; word-break:break-word; margin-bottom:15px;
}
/* 指标条 */
.metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:10px; margin-bottom:17px}
.metric{
  background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; text-align:center;
}
.metric b{display:block; font-size:19px; font-family:var(--mono); color:var(--fg); line-height:1.25}
.metric span{font-size:10.5px; color:var(--fg-3); letter-spacing:.5px}

/* 步骤时间线 */
.steps{position:relative; padding-left:3px}
.step{display:flex; gap:13px; position:relative; padding-bottom:15px}
.step:last-child{padding-bottom:0}
.step::before{ /* 竖线 */
  content:""; position:absolute; left:12px; top:26px; bottom:-2px;
  width:1px; background:var(--line-2);
}
.step:last-child::before{display:none}
.step .idx{
  width:25px;height:25px;border-radius:50%;flex:none;z-index:1;
  display:grid;place-items:center; font-size:11px; font-family:var(--mono); font-weight:700;
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--fg-2);
}
.step.ok .idx{background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.45); color:var(--green)}
.step.fail .idx{background:rgba(248,113,113,.13); border-color:rgba(248,113,113,.45); color:var(--red)}
.step .body{flex:1; min-width:0; padding-top:1px}
.step .act{font-family:var(--mono); font-size:12.5px; color:var(--cyan); font-weight:600}
.step .msg{font-size:12.5px; color:var(--fg-2); margin-top:3px; word-break:break-word}
.step .url{font-family:var(--mono); font-size:11px; color:var(--fg-3); margin-top:3px; word-break:break-all}

/* 任务列表 */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{
  text-align:left; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase;
  color:var(--fg-3); font-weight:600; padding:0 10px 9px; border-bottom:1px solid var(--line);
}
td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--fg-2); vertical-align:middle}
tbody tr{cursor:pointer; transition:background .12s}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:none}
td.tid{font-family:var(--mono); font-size:11.5px; color:var(--violet)}
td.task{color:var(--fg); max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.empty{text-align:center; color:var(--fg-3); padding:26px 0; font-size:12.5px}
.spin{
  display:inline-block; width:11px;height:11px; border-radius:50%;
  border:2px solid rgba(251,191,36,.3); border-top-color:var(--amber);
  animation:sp .7s linear infinite; vertical-align:-1px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.err{
  background:rgba(248,113,113,.09); border:1px solid rgba(248,113,113,.32);
  color:#fca5a5; border-radius:9px; padding:11px 13px; font-size:12.5px;
  white-space:pre-wrap; word-break:break-word;
}
footer{margin-top:26px; text-align:center; font-size:11.5px; color:var(--fg-3)}
footer a{color:var(--fg-2); text-decoration:none; border-bottom:1px dotted var(--line-2)}
footer a:hover{color:var(--cyan)}
code{font-family:var(--mono); font-size:11.5px; background:var(--panel-2); padding:1.5px 5px; border-radius:5px; color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">R</div>
    <div>
      <h1>browser-agent
        <small>ReAct 驱动的浏览器任务自动化 · 执行控制台</small>
      </h1>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="hp"><span class="dot" id="hd"></span><span id="ht">连接中…</span></span>
  </header>

    <div class="card">
      <h2>去哪搜 · 搜什么</h2>
      <p class="lead">
        选一个站点、输入关键词，直接跳到它的搜索页并把结果读回来。
        <b>关键词随你填</b> —— 这里没有写死的搜索内容。
      </p>
      <div class="sitebar">
        <select id="site" title="选择站点"><option value="">加载站点中…</option></select>
        <input type="text" id="kw" placeholder="想搜什么？例：机械键盘 / 三体 / ReAct 论文 / 显卡价格">
        <button class="btn btn-primary" id="gosearch">去搜索</button>
      </div>
      <div class="sitehint" id="sitehint">
        <!-- 这一行只是 /sites 返回前的占位；loadSites() 会用真实条数覆盖它。
             所以这里刻意**不写数字**：写死过 "60+"，站点表涨到 64 之后就成了假话，
             而占位内容没人会记得跟着改。数字一律交给接口给。 -->
        <span class="muted">正在加载站点列表…（综合搜索 / 电商 / 视频 / 社交 / 知识技术 / 求职 / 财经 / 新闻 等）</span>
      </div>
      <div class="quick-label">或者点一个现成例子</div>
      <div class="quick">
        <button data-t="打开名言网站首页，读出一句话的正文和作者" data-u="https://quotes.toscrape.com/">读名言</button>
        <button data-t="打开抖音首页，读出页面的主标题文字" data-u="https://www.douyin.com/">抖音首页</button>
        <button data-t="打开豆瓣电影 Top250，读出排名第一的电影名称和它的评分" data-u="https://movie.douban.com/top250">豆瓣Top250</button>
        <button data-t="打开微博热搜榜，读出当前排名第一的热搜话题" data-u="https://s.weibo.com/top/summary">微博热搜</button>
        <button data-t="打开 GitHub 趋势页，读出今日排名第一的仓库名称" data-u="https://github.com/trending">GitHub趋势</button>
        <button data-t="打开首页，取回页面的主标题文字" data-u="https://example.com/">读标题</button>
      </div>
    </div>

    <div class="card">
      <h2>提交任务</h2>
      <div class="grid">
        <div>
          <div class="f">
            <label for="task">任务描述</label>
            <textarea id="task" placeholder="例：在百度搜索「机械键盘」，读出第一条搜索结果的标题"></textarea>
            <div class="hintline" id="taskhint"></div>
          </div>
          <div class="f">
            <label for="url">起始网址</label>
            <input type="text" id="url" placeholder="https://" value="">
          </div>
        </div>
        <div>
          <div class="f">
            <label for="engine">引擎</label>
            <select id="engine"><option value="">默认</option></select>
          </div>
          <div class="f">
            <label for="ms">最大步数</label>
            <input type="text" id="ms" placeholder="留空用默认（20）">
          </div>
          <div class="f">
            <label class="chk"><input type="checkbox" id="mock"> 离线替身（不调真实模型、不花钱）</label>
          </div>
          <div class="f">
            <!-- 默认**勾上**：本地开发用控制台，看得见浏览器才有意义，
                而且遇到登录墙时"人工登录"这条路的**前提就是有一个窗口**。
                无头模式下交接只能被诚实地拒绝（见 api._login_handoff），
                所以默认给窗口，需要省资源时再取消勾选。 -->
            <label class="chk"><input type="checkbox" id="headful" checked> 显示浏览器窗口（需要登录时用得上）</label>
          </div>
        <button class="btn btn-primary" id="go" style="width:100%">▶ 开始执行</button>
      </div>
    </div>

    <div class="result" id="res">
      <div class="verdict">
        <span class="badge idle" id="vb">—</span>
        <span class="pill" id="vtid" style="display:none"></span>
      </div>
      <div class="loginbox" id="loginbox">
        <div><b>这个站点需要登录</b> —— 顺序是「先登录，再找内容」。</div>
        <div class="hint" id="loginhint"></div>
        <div class="row">
          <button class="btn btn-primary" id="logindone">我已完成登录，继续</button>
          <button class="btn" id="logincancel">放弃登录</button>
        </div>
      </div>
      <div class="answer" id="ans" style="display:none"></div>
      <div class="metrics" id="mets" style="display:none"></div>
      <div id="err"></div>
      <div id="steps" class="steps"></div>
    </div>
  </div>

  <div class="card">
    <h2>最近任务</h2>
    <table>
      <thead><tr>
        <th style="width:120px">任务 ID</th><th>任务</th>
        <th style="width:92px">引擎</th><th style="width:96px">状态</th>
        <th style="width:64px">步数</th><th style="width:78px">耗时</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="6" class="empty">暂无任务</td></tr></tbody>
    </table>
  </div>

  <footer>
    接口文档 <a href="/docs" target="_blank">/docs</a> ·
    <a href="/health" target="_blank">/health</a> ·
    <a href="/engines" target="_blank">/engines</a>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   整个前端零依赖：只用 fetch + 原生 DOM。
   理由：项目本身强调「运行时零第三方依赖」，前端也不该引入构建链。
------------------------------------------------------------------ */
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(async r => {
  const t = await r.text();
  let j; try { j = t ? JSON.parse(t) : {}; } catch { j = {detail: t}; }
  if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  return j;
});
let cur = null, timer = null;
/* 上一次「选站 + 关键词」的解析结果。提交时要靠它把 requires_login / login_url
   带给服务端（见 #go 的回调）。
   ⚠️ 用户一旦手改了任务或网址，这份解析结果就作废了 —— 否则换成一个完全
   不相干的任务时，会莫名其妙地按"上一个站点需要登录"来处理。 */
let lastResolve = null;

/* ---- 健康检查 + 引擎列表 ---- */
async function boot(){
  try{
    const h = await api('/health');
    $('#hd').className = 'dot ok';
    $('#ht').textContent = '在线';
    $('#mock').checked = !h.llm_configured;   // 没配 key 就默认勾离线，避免一点就报错
    const e = await api('/engines');
    const sel = $('#engine');
    e.available.forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v + (v === e.default ? '（默认）' : '');
      sel.appendChild(o);
    });
    if (e.available.includes('langgraph')) sel.value = e.default;
  }catch(err){
    $('#hd').className = 'dot bad';
    $('#ht').textContent = '离线';
    $('#mock').checked = true;
  }
}

/* ---- 提交任务 ---- */
$('#go').onclick = async () => {
  const task = $('#task').value.trim(), url = $('#url').value.trim();
  if(!task){ alert('请填写任务描述'); return; }
  if(!url){ alert('请填写起始网址'); return; }
  const body = { task, url, mock: $('#mock').checked };
  const eng = $('#engine').value; if(eng) body.engine = eng;
  const ms = parseInt($('#ms').value, 10); if(ms > 0) body.max_steps = ms;
  // 勾了"显示浏览器窗口" → headless=false。服务端据此起有头浏览器，
  // 这样**任何**任务（包括手动填的登录网址）都能走人工登录交接，
  // 而不是只有注册表里标了 needs_login 的站点才行。
  body.headless = !$('#headful').checked;
  // 把"这个站已知要登录"这份知识**交给服务端**，而不是只在本页显示一个警告角标。
  // 只显示不传递，就是知道了却不用 —— 实测的后果是：Agent 拿着一个必然被拦的
  // 搜索网址开跑，被拦后又识别不出来（页面已变成 about:blank），最后报"无法完成"。
  if(lastResolve && lastResolve.needs_login){
    body.requires_login = true;
    if(lastResolve.login_url) body.login_url = lastResolve.login_url;
  }

  $('#go').disabled = true; $('#go').textContent = '提交中…';
  $('#err').innerHTML = ''; $('#steps').innerHTML = '';
  $('#ans').style.display = 'none'; $('#mets').style.display = 'none';
  try{
    const r = await api('/tasks', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    cur = r.task_id;
    $('#res').classList.add('show');
    $('#vtid').style.display = ''; $('#vtid').textContent = cur;
    paint({status:'pending', steps:0, records:[]});
    poll();
  }catch(e){
    $('#res').classList.add('show');
    $('#err').innerHTML = '<div class="err">提交失败：' + esc(e.message) + '</div>';
  }finally{
    $('#go').disabled = false; $('#go').textContent = '▶ 开始执行';
  }
};

/* ---- 登录交接：人是唯一有凭据的一方，引擎只负责等和继续 ---- */
$('#logindone').onclick = async () => {
  if(!cur) return;
  $('#logindone').disabled = true;
  try{
    await api('/tasks/' + cur + '/login-done', {method:'POST'});
    $('#loginbox').style.display = 'none';
  }catch(e){ alert('通知失败：' + e.message); }
  finally{ $('#logindone').disabled = false; }
};
$('#logincancel').onclick = async () => {
  if(!cur) return;
  $('#logincancel').disabled = true;
  try{
    await api('/tasks/' + cur + '/login-cancel', {method:'POST'});
    $('#loginbox').style.display = 'none';
  }catch(e){ alert('通知失败：' + e.message); }
  finally{ $('#logincancel').disabled = false; }
};

/* ---- 轮询：任务是后台异步跑的，只有靠自己拉 ----
   pending/running 每 1.2s 拉一次；终态就停，避免无意义的请求。 */
function poll(){
  clearInterval(timer);
  timer = setInterval(async () => {
    if(!cur) return;
    try{
      const t = await api('/tasks/' + cur);
      paint(t);
      if(t.status === 'succeeded' || t.status === 'failed'){ clearInterval(timer); load(); }
    }catch(e){ /* 单次失败不打断轮询 */ }
  }, 1200);
}

const BADGE = {pending:['run','排队中'], running:['run','执行中'], succeeded:['ok','成功'], failed:['bad','失败'],
  waiting_login:['wait','等待登录']};
const LABEL = {pending:'排队中', running:'执行中', succeeded:'成功', failed:'失败', waiting_login:'等待登录'};

function paint(t){
  const [cls, txt] = BADGE[t.status] || ['idle', t.status];
  // 等待登录时必须把"该你干活了"说清楚：只转圈的话，
  // 使用者不知道是自己该登录，只会以为卡住了。
  //
  // 2026-09-22 追加：**交接失败的原因也要显示出来**。原先只在
  // status === 'waiting_login' 时显示这个框，于是"无头模式没法登录"
  // "等待登录超时"这两种失败提示被静默吞掉了 —— 使用者只看到任务失败，
  // 不知道改一个环境变量就能解决。现在只要 login_hint 非空就显示，
  // 但**只有真的在等登录时才给按钮**（否则点了也没意义）。
  const lb = $('#loginbox');
  const hint = t.login_hint || '';
  const waiting = t.status === 'waiting_login';
  if(waiting || hint){
    lb.style.display = '';
    $('#loginhint').textContent = hint || '请在浏览器窗口里完成登录。';
    const btns = waiting ? '' : 'none';
    $('#logindone').style.display = btns;
    $('#logincancel').style.display = btns;
  } else {
    lb.style.display = 'none';
  }
  const vb = $('#vb');
  vb.className = 'badge ' + cls;
  vb.innerHTML = (t.status === 'running' || t.status === 'pending' ? '<span class="spin"></span> ' : '') + txt;
  $('#vtid').textContent = t.task_id || cur || '';

  if(t.error){ $('#err').innerHTML = '<div class="err">' + esc(t.error) + '</div>'; }
  else { $('#err').innerHTML = ''; }

  if(t.answer){
    $('#ans').style.display = ''; $('#ans').textContent = t.answer;
  }
  // 指标只在跑完之后才有意义，但执行中也显示实时 token
  if(t.steps || t.status !== 'pending'){
    const offline = !!t.offline;
    const m = [
      ['步数', t.steps ?? 0],
      ['耗时', (t.elapsed_seconds ?? 0).toFixed(1) + 's'],
      // 离线替身的 token 是按字符估出来的，不是真实用量；成本同理。
      // 标成裸的 "Token / 成本" 会被读成"这次真花了这些钱" —— 必须让口径可见。
      ['Token' + (offline ? '（估算）' : ''), t.total_tokens ?? 0],
      [offline ? '成本（离线，未产生费用）' : '成本',
       offline ? '¥0' : '¥' + (t.cost_yuan ?? 0).toFixed(5)],
    ];
    $('#mets').style.display = '';
    $('#mets').innerHTML = m.map(([k,v]) => `<div class="metric"><b>${esc(String(v))}</b><span>${k}</span></div>`).join('');
  }

  const rec = t.records || [];
  $('#steps').innerHTML = rec.map(r => `
    <div class="step ${r.ok ? 'ok' : 'fail'}">
      <div class="idx">${r.step}</div>
      <div class="body">
        <div class="act">${esc(r.action ?? '(无动作)')}</div>
        <div class="msg">${esc(r.message)}</div>
        ${r.url_after ? '<div class="url">' + esc(r.url_after) + '</div>' : ''}
      </div>
    </div>`).join('');
}

/* ---- 任务列表 ---- */
async function load(){
  try{
    const d = await api('/tasks?limit=20');
    const tb = $('#tb');
    if(!d.items || !d.items.length){
      tb.innerHTML = '<tr><td colspan="6" class="empty">暂无任务</td></tr>'; return;
    }
    tb.innerHTML = d.items.map(i => {
      const st = i.status;
      const color = st === 'succeeded' ? 'var(--green)' : st === 'failed' ? 'var(--red)'
                  : st === 'running' ? 'var(--amber)' : 'var(--fg-3)';
      return `<tr data-id="${esc(i.task_id)}">
        <td class="tid">${esc(i.task_id)}</td>
        <td class="task" title="${esc(i.task)}">${esc(i.task)}</td>
        <td>${esc(i.engine || '-')}</td>
        <td style="color:${color}">${esc(LABEL[st] || st)}</td>
        <td>${i.steps ?? '-'}</td>
        <td>${i.elapsed_seconds != null ? i.elapsed_seconds.toFixed(1) + 's' : '-'}</td>
      </tr>`;
    }).join('');
    tb.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => {
      cur = tr.dataset.id;
      $('#res').classList.add('show');
      api('/tasks/' + cur).then(paint).catch(e => {});
    });
  }catch(e){}
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 快捷示例 */
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => {
  $('#task').value = b.dataset.t; $('#url').value = b.dataset.u;
  $('#taskhint').textContent = '';
});

/* ------------------------------------------------------------------
   选站搜索：站点 + 关键词 → 搜索页网址
   网址和任务描述都在服务端拼（POST /resolve），前端不存一份模板副本 ——
   两处各存一份的话，站点改了 query 参数名时前端那份必然忘记同步，
   表现为"选淘宝却跳去了京东"这类很难查的错位。
------------------------------------------------------------------ */
let SITE_MAP = {};

function siteHintFor(s){
  const p = s.probe;
  if(p && p.ok === false){
    const why = (p.block_hints && p.block_hints.length) ? ('命中提示：' + p.block_hints.join('、')) : p.verdict;
    return `<span class="warn">⚠ ${esc(s.name)} 上次探测为「${esc(p.verdict)}」：${esc(why)}</span>`;
  }
  if(s.needs_login){
    return `<span class="warn">⚠ ${esc(s.name)} 的搜索页通常要求登录 / 有验证，任务可能被安全护栏拦下。</span>`;
  }
  if(p && p.ok === true){
    return `<span class="good">✓ 上次探测可正常读取</span>（元素 ${p.elements} / 正文 ${p.body_len} 字）`;
  }
  return `<span class="muted">该站点尚未探测；可跑 <code>python main.py --probe-sites</code> 实测。</span>`;
}

async function loadSites(){
  const sel = $('#site'), hint = $('#sitehint');
  try{
    const d = await api('/sites');
    const groups = {};
    (d.sites || []).forEach(s => (groups[s.category] = groups[s.category] || []).push(s));
    sel.innerHTML = Object.keys(groups).map(cat =>
      `<optgroup label="${esc(cat)}">` + groups[cat].map(s =>
        `<option value="${esc(s.key)}">${esc(s.name)}${s.needs_login ? '（需登录）' : ''}</option>`
      ).join('') + `</optgroup>`
    ).join('');
    SITE_MAP = {};
    (d.sites || []).forEach(s => SITE_MAP[s.key] = s);
    const n = (d.sites || []).length;
    const probe = d.probe;
    const line = probe && probe.summary
      ? `已探测 ${probe.summary.total} 个站点（${new Date(probe.probed_at).toLocaleString()}），可正常读取 ${probe.summary.accessible} 个。`
      : (d.probe_hint || '');
    hint.innerHTML = `<span class="muted">共 ${n} 个站点。${esc(line)}</span>`;
    onSiteChange();
  }catch(e){
    sel.innerHTML = '<option value="">站点列表加载失败</option>';
    hint.innerHTML = '<span class="warn">站点列表加载失败：' + esc(e.message) + '</span>';
  }
}

function onSiteChange(){
  const s = SITE_MAP[$('#site').value];
  if(!s) return;
  $('#sitehint').innerHTML = siteHintFor(s);
}

async function goSearch(){
  const site = $('#site').value, kw = $('#kw').value.trim();
  if(!site){ alert('请先选择站点'); return; }
  if(!kw){ $('#kw').focus(); alert('请输入要搜索的关键词'); return; }
  const btn = $('#gosearch');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '解析中…';
  try{
    const r = await api('/resolve', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ site, keyword: kw })
    });
    $('#task').value = r.task;
    $('#url').value = r.url;
    // 程序化赋值不会触发 input 事件，所以这里要在赋值**之后**才记下来。
    lastResolve = r;
    $('#taskhint').innerHTML = r.needs_login
      ? `<span class="warn">⚠ ${esc(r.warning)}</span>`
      : `<span class="good">✓ 已解析</span> <code>${esc(r.url)}</code>`;
    // 解析完直接跑：这一步的信息已经齐全（任务描述 + 起始网址），
    // 再让用户点一次"开始执行"只是多一次点击，没有多出任何决策。
    $('#go').click();
  }catch(e){
    $('#taskhint').innerHTML = '<span class="warn">解析失败：' + esc(e.message) + '</span>';
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

$('#gosearch').onclick = goSearch;
$('#site').onchange = onSiteChange;
// 手改任务或网址 → 上一次的解析结果作废（否则会把"上一个站点要登录"
// 这件事错用到新任务上）。
$('#task').addEventListener('input', () => { lastResolve = null; });
$('#url').addEventListener('input', () => { lastResolve = null; });
$('#kw').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); goSearch(); } });

$('#mock').addEventListener('change', () => {
  // 离线替身 + 真实模型的按钮文案要区别开，避免误以为在花钱
});

loadSites();
boot().then(load);
setInterval(load, 8000);
</script>
